# Ready-to-paste [lints] table for this skill. Cargo 1.74+.
# Copy into Cargo.toml as-is, or rename [lints. to [workspace.lints. and set
# `lints.workspace = true` on each crate. Every level is warn; do not
# deny(warnings) in source (SKILL.md §2).

[lints.rust]
# §10 Documentation: /// on every public item.
missing_docs = "warn"
# §8 Unsafe: unsafe operations in an unsafe fn need an unsafe block.
unsafe_op_in_unsafe_fn = "warn"
# §4 Visibility: private by default; every pub item is a promise.
unreachable_pub = "warn"
# §4 Traits: derive Debug on every public type.
missing_debug_implementations = "warn"

[lints.clippy]
# §2 Handback: clippy owns idiom checks.
all = { level = "warn", priority = -1 }
# §2 Handback: pedantic extras; allow below where this skill disagrees.
pedantic = { level = "warn", priority = -1 }

# §5 Errors: no unwrap() in library code.
unwrap_used = "warn"
# §5 Errors: warn on expect() in library code; application code may allow it.
expect_used = "warn"
# §10 Documentation: # Errors on every Result-returning item.
missing_errors_doc = "warn"
# §10 Documentation: # Panics on every reachable panic.
missing_panics_doc = "warn"
# §4 Types: no bool parameters in public or shared signatures.
fn_params_excessive_bools = "warn"
# §4 Traits: #[must_use] on pure functions and on types whose discard is a bug.
must_use_candidate = "warn"
# §12 Performance: Rc<str> / Rc<[u8]>, not Rc<String> / Rc<Vec<u8>>.
rc_buffer = "warn"
# §3 Ownership: do not clone only to satisfy the borrow checker.
redundant_clone = "warn"
# §8 Unsafe: every unsafe block needs a // SAFETY: comment.
undocumented_unsafe_blocks = "warn"
# §6 Idioms: no glob imports except use super::* in tests and use Enum::* in a match.
wildcard_imports = "warn"
# §6 Idioms: format! / write!, not chained +.
string_add = "warn"

# §9 Modules: Foo lives in foo.rs, which is foo::Foo.
module_inception = "allow"
# §6 Idioms: use Enum::* inside a function that matches on it is allowed.
enum_glob_use = "allow"
